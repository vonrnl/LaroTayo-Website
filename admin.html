<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Panel – Laro Tayo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">

  <!-- TOP NAVBAR -->
  <nav class="admin-nav">
    <a href="index.html" class="logo">
      <span class="logo-o">LARO TAYO</span>
    </a>
    <div class="admin-nav-tabs" id="admin-nav-tabs">
      <button class="admin-tab-btn active" data-tab="users">
        <span>Users</span>
        <span class="tab-count" id="user-count-badge">0</span>
      </button>
      <button class="admin-tab-btn" data-tab="register">
        <span>Register</span>
      </button>
      <button class="admin-tab-btn" data-tab="settings">
        <span>Settings</span>
      </button>
    </div>
    <div class="admin-nav-right">
      <div class="admin-nav-badge">
        <span>ADMIN</span>
      </div>
      <button class="admin-logout-btn" id="admin-logout">
        Logout
      </button>
      <button class="admin-hamburger" id="admin-hamburger">
        Menu
      </button>
    </div>
  </nav>

  <!-- MOBILE DROPDOWN MENU -->
  <div class="admin-mobile-menu" id="admin-mobile-menu">
    <button class="admin-tab-btn active" data-tab="users">
      Users
    </button>
    <button class="admin-tab-btn" data-tab="register">
      Register
    </button>
    <button class="admin-tab-btn" data-tab="settings">
      Settings
    </button>
  </div>

  <main class="admin-main">

    <!-- STUDENTS TAB -->
    <div class="admin-tab-panel active" id="tab-users">
      <div class="admin-page-header">
        <div>
          <h1>Registered Users</h1>
          <p>View and manage all registered user accounts.</p>
        </div>
      </div>
      <div class="admin-toolbar">
        <div class="admin-search-wrap">
          <input type="text" id="user-search" class="admin-search" placeholder="Search by name or email..." />
        </div>
      </div>
      <div class="admin-table-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Username</th>
                <th>Email</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- REGISTER TAB -->
    <div class="admin-tab-panel" id="tab-register">
      <div class="admin-page-header">
        <div>
          <h1>Register User</h1>
          <p>Create a new user account.</p>
        </div>
      </div>
      <div class="register-form-card">
        <div class="register-form-inner">
          <div class="register-field">
            <label class="register-label">
              Username
            </label>
            <input type="text" class="admin-input-field" id="reg-username" placeholder="username" maxlength="30" />
          </div>
          <div class="register-field">
            <label class="register-label">
              Email Address
            </label>
            <input type="email" class="admin-input-field" id="reg-email" placeholder="e.g. juan@email.com" />
          </div>
          <div class="register-field">
            <label class="register-label">
              Password
            </label>
            <input type="password" class="admin-input-field" id="reg-password" placeholder="Minimum 6 characters" />
          </div>
          <div class="register-field">
            <label class="register-label">
              Confirm Password
            </label>
            <input type="password" class="admin-input-field" id="reg-confirm" placeholder="Re-enter password" />
          </div>
          <button class="admin-action-btn orange register-submit-btn" id="register-student-btn">
            Register Student
          </button>
        </div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div class="admin-tab-panel" id="tab-settings">
      <div class="admin-page-header">
        <div>
          <h1>Settings</h1>
          <p>Configure panel preferences.</p>
        </div>
      </div>
      <div class="settings-grid">
        <div class="settings-card">
          <h3>Change Password</h3>
          <div class="settings-field">
            <label>Current Password</label>
            <input type="password" class="admin-input-field" id="cur-pass" placeholder="Current password" />
          </div>
          <div class="settings-field">
            <label>New Password</label>
            <input type="password" class="admin-input-field" id="new-pass" placeholder="New password" />
          </div>
          <div class="settings-field">
            <label>Confirm New Password</label>
            <input type="password" class="admin-input-field" id="conf-pass" placeholder="Confirm new password" />
          </div>
          <button class="admin-action-btn orange" id="change-pass-btn">
            Update Password
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- STUDENT PROGRESS MODAL -->
  <div class="modal-overlay" id="progress-modal-overlay">
    <div class="modal-card modal-wide" id="progress-modal">
      <div class="modal-header">
        <h3 id="progress-modal-title">Student Progress</h3>
        <button class="modal-close-btn" id="progress-close-btn">
          Close
        </button>
      </div>
      <div class="modal-body" id="progress-modal-body"></div>
    </div>
  </div>

  <script type="module" src="script/admin.js"></script>
</body>
</html>
